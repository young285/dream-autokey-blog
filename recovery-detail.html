<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상세 복구 검사</title>
<style>body{font-family:system-ui;background:#f3f6fb;color:#172033;margin:0}.w{max-width:760px;margin:auto;padding:16px}.c{background:white;border:1px solid #dbe2ea;border-radius:20px;padding:18px;margin:12px 0}button{width:100%;padding:17px;border:0;border-radius:14px;background:#059669;color:white;font-size:18px;font-weight:900}.i{border:1px solid #dbe2ea;border-radius:12px;padding:11px;margin:8px 0}.v{font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;background:#f1f5f9;padding:8px;border-radius:8px}.g{color:#047857;font-weight:900}.m{color:#64748b}</style></head>
<body><div class=w><div class=c><h1>🛟 상세 복구 검사</h1><p><b>읽기 전용</b>입니다. 데이터는 수정·삭제하지 않습니다.</p><button id=s>🔎 남아있는 데이터 상세 보기</button><p id=sum class=m>아직 검사하지 않았습니다.</p></div><div class=c><h2>① localStorage</h2><div id=ls></div></div><div class=c><h2>② IndexedDB 전체</h2><div id=db></div></div><div class=c><h2>③ 게시글 흔적</h2><div id=hit></div></div></div>
<script>
const e=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const w=['게시완료','게시대기','posted','queue','draft','title','body','content','region','car','vehicle','스마트키','블로그'];
function rd(d,n){return new Promise(ok=>{try{let q=d.transaction(n,'readonly').objectStore(n).getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>ok([])}catch(x){ok([])}})}
document.getElementById('s').onclick=async()=>{
let corp=[],lh='',dh='',hh=[];for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i),v=localStorage.getItem(k)||'';corp.push(['localStorage / '+k,v]);lh+=`<div class=i><b>${e(k)}</b><div class=m>${v.length}자</div><div class=v>${e(v.slice(0,12000))}</div></div>`}document.getElementById('ls').innerHTML=lh||'없음';
let dl=[];try{dl=indexedDB.databases?await indexedDB.databases():[]}catch(x){}
for(let z of dl){if(!z.name)continue;try{let d=await new Promise((ok,no)=>{let q=indexedDB.open(z.name,z.version);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});dh+=`<div class=i><b>DB: ${e(z.name)} v${d.version}</b>`;for(let n of [...d.objectStoreNames]){let a=await rd(d,n);dh+=`<div class=g>저장소 ${e(n)} — ${a.length}건</div>`;a.forEach((r,j)=>{let t='';try{t=JSON.stringify(r)}catch(x){t=String(r)}corp.push([`${z.name} / ${n} / #${j+1}`,t]);dh+=`<div class=v><b>#${j+1}</b><br>${e(t.slice(0,12000))}</div>`})}dh+='</div>';d.close()}catch(x){}}
document.getElementById('db').innerHTML=dh||'DB 없음';for(let x of corp){let f=w.filter(q=>x[1].toLowerCase().includes(q.toLowerCase()));if(f.length)hh.push([x[0],f,x[1]])}document.getElementById('hit').innerHTML=hh.length?hh.map((x,i)=>`<div class=i><b>${i+1}. ${e(x[0])}</b><div>${e(x[1].join(', '))}</div><div class=v>${e(x[2].slice(0,12000))}</div></div>`).join(''):'게시글 관련 흔적 없음';document.getElementById('sum').innerHTML=`검사 완료 · localStorage <b>${localStorage.length}개</b> · DB <b>${dl.length}개</b> · 흔적 <b>${hh.length}곳</b>`};
</script></body></html>
