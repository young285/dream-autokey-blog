<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>드림블로그 로컬 원고 확인</title><style>body{font-family:system-ui,sans-serif;background:#f3f6fb;color:#15243c;margin:0;padding:18px}main{max-width:760px;margin:auto}h1{font-size:24px}.box,article{background:white;border-radius:15px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #0001}button{background:#1559db;color:white;border:0;border-radius:10px;padding:13px 17px;font-size:16px;margin:5px 5px 5px 0}button:disabled{background:#999}img{max-width:100%;max-height:420px;object-fit:contain;margin:7px 0;border-radius:9px}pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;line-height:1.7}small{color:#666}.err{color:#b00020}</style></head><body><main><h1>🔑 드림블로그 원고 확인</h1><div class="box"><strong>로그인 없는 로컬 원고 열람 전용</strong><p>기존 앱의 IndexedDB를 읽기만 합니다. 원고를 수정하거나 삭제하거나 클라우드에 보내지 않습니다.</p><button id="scan">원고 다시 확인</button><button id="backup" disabled>전체 원고 JSON 백업</button><p id="status">검사 준비 중...</p></div><div id="posts"></div></main><script>
'use strict';let rows=[];const $=x=>document.getElementById(x);function status(s,bad=false){$('status').textContent=s;$('status').className=bad?'err':''}function getPosts(){return new Promise((resolve,reject)=>{let req=indexedDB.open('dream_blog_v2');req.onupgradeneeded=()=>{req.transaction.abort();reject(Error('기존 저장소가 없습니다.'))};req.onerror=()=>reject(req.error||Error('저장소 열기 실패'));req.onblocked=()=>reject(Error('다른 탭에서 저장소를 사용 중입니다.'));req.onsuccess=()=>{let db=req.result;if(!db.objectStoreNames.contains('posts')){db.close();reject(Error('posts 저장 공간이 없습니다.'));return}let tx=db.transaction('posts','readonly');let r=tx.objectStore('posts').getAll();r.onsuccess=()=>{resolve(r.result||[])};r.onerror=()=>reject(r.error||Error('원고 읽기 실패'));tx.oncomplete=()=>db.close()}})}function el(tag,txt,cls){let n=document.createElement(tag);if(txt!=null)n.textContent=txt;if(cls)n.className=cls;return n}async function scan(){status('휴대폰 저장소 검사 중...');$('posts').replaceChildren();$('backup').disabled=true;try{rows=await getPosts();let photoCount=rows.reduce((n,p)=>n+(Array.isArray(p.photos)?p.photos.length:0),0);status('확인 완료: 원고 '+rows.length+'건 · 사진 '+photoCount+'장');$('backup').disabled=!rows.length;for(let p of rows){let a=el('article');a.append(el('h2',p.title||p.car||'제목 없음'),el('small','상태: '+(p.status||'미지정')+' · '+(p.publishDate||'')),el('pre',p.body||''));let photos=Array.isArray(p.photos)?p.photos:[];a.append(el('h3','사진 '+photos.length+'장'));for(let src of photos){if(typeof src!=='string'||!src.startsWith('data:image/'))continue;let im=document.createElement('img');im.src=src;im.loading='lazy';a.append(im)}if(p.tags)a.append(el('pre',p.tags));$('posts').append(a)}}catch(e){status('확인 실패: '+(e.message||e)+'. 같은 브라우저에서 GitHub Pages 주소로 열었는지 확인하세요.',true)}}$('scan').onclick=scan;$('backup').onclick=()=>{let blob=new Blob([JSON.stringify({version:'read-only-backup',exportedAt:new Date().toISOString(),posts:rows},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='드림블로그_로컬원고_백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)};scan();
</script></body></html>
