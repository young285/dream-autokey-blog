<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>드림 블로그 데이터 복구검사</title>
<style>body{font-family:system-ui;background:#f3f6fb;color:#172033;margin:0}.w{max-width:760px;margin:auto;padding:18px}.c{background:#fff;border:1px solid #dbe2ea;border-radius:20px;padding:20px;margin:14px 0}button{width:100%;padding:16px;margin:6px 0;border:0;border-radius:14px;background:#059669;color:#fff;font-size:17px;font-weight:800}.b{background:#334155}.n{padding:14px;background:#eef4ff;border-radius:12px;white-space:pre-wrap}.db{border:1px solid #dbe2ea;border-radius:12px;padding:12px;margin:9px 0}.s{background:#f8fafc;padding:9px;border-radius:9px;margin-top:7px}.g{color:#047857;font-weight:900}.r{color:#b91c1c;font-weight:900}.m{color:#64748b}</style></head>
<body><div class="w"><div class="c"><h1>🛟 데이터 복구 검사</h1><p><b>읽기 전용</b> 검사입니다. 기존 글을 수정하거나 삭제하지 않습니다.</p><button id="scan">🔎 저장 데이터 전체 검사</button><button id="save" class="b" disabled>💾 검사 결과 저장</button><div id="sum" class="n">아직 검사하지 않았습니다.</div></div><div class="c"><h2>검사 결과</h2><div id="out" class="m">검사 버튼을 눌러주세요.</div></div><div class="c"><b>주의</b><p class="m">앱 삭제, Chrome 사이트 데이터 삭제, 저장공간 초기화를 하지 마세요.</p></div></div>
<script>
let REPORT={};const E=s=>String(s??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));
async function dbList(){if(indexedDB.databases){try{return await indexedDB.databases()}catch(e){}}return [{name:'dream_blog_v2'}]}
function openExisting(x){return new Promise((ok,no)=>{let q=indexedDB.open(x.name,x.version||undefined);let upgraded=false;q.onupgradeneeded=e=>{upgraded=true;try{e.target.transaction.abort()}catch(_){}};q.onsuccess=()=>upgraded?no(Error('존재하지 않음')):ok(q.result);q.onerror=()=>no(q.error||Error('열기 실패'))})}
function readStore(db,n){return new Promise(ok=>{try{let q=db.transaction(n,'readonly').objectStore(n).getAll();q.onsuccess=()=>ok({name:n,count:q.result.length,records:q.result});q.onerror=()=>ok({name:n,count:-1,error:String(q.error),records:[]})}catch(e){ok({name:n,count:-1,error:String(e),records:[]})}})}
async function scan(){let sum=document.getElementById('sum'),out=document.getElementById('out');sum.textContent='검사 중...';out.innerHTML='';REPORT={time:new Date().toISOString(),origin:location.origin,databases:[],localStorage:{}};try{for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);REPORT.localStorage[k]=localStorage.getItem(k)}}catch(e){}
let list=await dbList();if(!list.some(x=>x.name==='dream_blog_v2'))list.push({name:'dream_blog_v2'});for(let x of list){if(!x.name)continue;try{let db=await openExisting(x),d={name:x.name,version:db.version,stores:[]};for(let n of [...db.objectStoreNames])d.stores.push(await readStore(db,n));db.close();REPORT.databases.push(d)}catch(e){}}
let total=0,html='';for(let d of REPORT.databases){html+=`<div class=db><b>DB: ${E(d.name)}</b> v${d.version}`;for(let s of d.stores){if(s.count>0)total+=s.count;html+=`<div class=s>저장소 <b>${E(s.name)}</b> — <span class=${s.count>0?'g':''}>${s.count}건</span></div>`}html+='</div>'}html+=`<div class=db><b>localStorage</b> — ${Object.keys(REPORT.localStorage).length}개</div>`;out.innerHTML=html||'<span class=r>데이터베이스를 찾지 못했습니다.</span>';sum.innerHTML=`검사 완료<br><b>DB 저장 레코드 합계: ${total}건</b><br>localStorage: ${Object.keys(REPORT.localStorage).length}개`;document.getElementById('save').disabled=false}
document.getElementById('scan').onclick=scan;document.getElementById('save').onclick=()=>{let b=new Blob([JSON.stringify(REPORT,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='드림블로그_복구검사.json';a.click()};
</script></body></html>
