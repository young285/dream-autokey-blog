<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a3d"><meta name="app-version" content="1.0"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>드림 자동차키 블로그</title>
<style>
:root{--navy:#071a3d;--blue:#2563eb;--line:#dbe3ef;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:#172033}.top{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#071a3d,#123c78);color:#fff;padding:15px 16px;box-shadow:0 2px 12px #0002}.top h1{font-size:19px;margin:0}.top small{opacity:.8}.wrap{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0000000b}.hero{background:linear-gradient(135deg,#eaf5ff,#fff)}h2{font-size:17px;margin:0 0 10px}label{font-size:12px;font-weight:800;display:block;margin:8px 0 5px}input,textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:11px;font-size:15px;background:#fff}textarea{min-height:88px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}button{border:0;border-radius:11px;padding:11px 13px;font-weight:900;background:var(--blue);color:#fff}.secondary{background:#475569}.warn{background:#f59e0b}.danger{background:#ef4444}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.pc{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}.pc img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.pc div{padding:5px;font-size:11px;color:#64748b}.out{min-height:230px;line-height:1.7}.note{font-size:12px;color:#64748b;line-height:1.5}.phone-note{background:#fff7ed;color:#9a3412;padding:9px;border-radius:10px;margin-top:8px}.copy{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.copy button{padding:10px 4px}.history{display:flex;gap:7px;overflow:auto}.hist{min-width:170px;background:#fff;color:#172033;border:1px solid var(--line);text-align:left}.status{font-size:12px;color:#047857;font-weight:800;margin-top:7px}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.photos{grid-template-columns:repeat(2,1fr)}.copy{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="top"><h1>🔑 드림 자동차키 블로그</h1><small>네이버 블로그 작업 전용 · v1.0</small></header><main class="wrap">
<div class="card hero"><h2>✍️ 작업 하나로 블로그 원고 완성</h2><div class="note">차량 정보와 사진을 넣으면 제목·본문·태그를 만들고, 사진에는 <b>010-3004-0452</b>를 노란색으로 넣습니다.</div></div>
<div class="card"><h2>최근 작성</h2><div id="history" class="history"></div><div class="actions"><button id="newBtn" class="secondary">+ 새 글</button></div></div>
<div class="card"><h2>작업 정보</h2><div class="grid"><div><label>차량 / 차종</label><input id="car" placeholder="예: 르노 QM6"></div><div><label>연식</label><input id="year" inputmode="numeric" placeholder="예: 2020"></div><div><label>지역</label><input id="region" value="인천 송도" placeholder="예: 인천 송도"></div><div><label>작업</label><input id="work" placeholder="예: 스마트키 추가 복사"></div><div class="full"><label>고객 요청 / 작업 이유</label><textarea id="reason" placeholder="예: 스마트키가 하나뿐이라 분실에 대비해 예비키 제작"></textarea></div><div><label>사용 장비</label><input id="equipment" value="전용 장비"></div><div><label>작업 결과</label><input id="result" placeholder="예: 기존키와 추가키 2개 모두 정상작동"></div><div class="full"><label>추가 메모</label><textarea id="memo" placeholder="작업 중 확인한 내용"></textarea></div></div><div class="actions"><button id="generate">✨ 블로그 글 만들기</button><button id="save" class="secondary">💾 작업 저장</button></div></div>
<div class="card"><h2>사진</h2><div class="grid"><div><label>전화번호</label><input id="phone" value="010-3004-0452"></div><div><label>글자 크기</label><select id="size"><option value=".05">보통</option><option value=".062" selected>조금 크게</option><option value=".075">크게</option></select></div></div><div class="actions"><button id="pick">🖼️ 사진 여러 장 선택</button><button id="clearPhotos" class="secondary">사진 비우기</button></div><input id="files" type="file" accept="image/*" multiple hidden><div class="phone-note">원본은 바꾸지 않고 별도의 번호 사진을 만듭니다. 오른쪽 아래에 노란색 전화번호 + 검은 테두리로 표시합니다.</div><div id="photos" class="photos"></div><div class="actions"><button id="watermark" class="warn">📷 전화번호 넣기</button><button id="download" class="secondary">번호 사진 모두 저장</button></div></div>
<div class="card"><h2>완성 원고</h2><label>제목</label><textarea id="title" style="min-height:75px"></textarea><label>본문</label><textarea id="body" class="out"></textarea><label>태그</label><textarea id="tags"></textarea><div class="copy"><button data-copy="all">전체 복사</button><button data-copy="title" class="secondary">제목 복사</button><button data-copy="body" class="secondary">본문 복사</button><button data-copy="tags" class="secondary">태그 복사</button></div><div class="actions"><button id="naver" class="secondary">네이버 블로그 열기</button></div><div id="status" class="status"></div></div>
</main><script>
const $=s=>document.querySelector(s);let srcPhotos=[],marked=[];const key='dream_blog_posts_v1';
function tags(car,region){let a=[region.replace(/\s/g,'')+'스마트키',car.replace(/\s/g,'')+'스마트키',car.replace(/\s/g,'')+'키복사',car.replace(/\s/g,'')+'스마트키추가','스마트키복사','스마트키추가','스마트키제작','자동차키','차키복사','차키제작','예비키','자동차열쇠','스마트키등록','출장스마트키','인천스마트키','송도스마트키'];return [...new Set(a.filter(x=>x.length>1))].map(x=>'#'+x).join(' ')}
function build(){const car=$('#car').value.trim()||'차량',y=$('#year').value.trim(),r=$('#region').value.trim()||'인천 송도',w=$('#work').value.trim()||'스마트키 작업',why=$('#reason').value.trim(),eq=$('#equipment').value.trim()||'전용 장비',rs=$('#result').value.trim()||'정상 작동 확인',m=$('#memo').value.trim(),yr=y?y+'년식 ':'';$('#title').value=`${r} ${yr}${car} ${w}, 예비키 제작 작업`;$('#body').value=`안녕하세요. ${r}에서 자동차 스마트키 작업을 진행하고 있습니다.\n\n오늘 작업 차량은 ${yr}${car}입니다. 이번에는 ${w} 작업을 진행했습니다.${why?`\n\n고객님께서는 ${why} 때문에 추가 작업을 요청하셨습니다.`:''}\n\n[차량 및 작업 정보]\n- 차량: ${yr}${car}\n- 지역: ${r}\n- 작업: ${w}\n- 장비: ${eq}\n\n차량과 기존 스마트키 상태를 먼저 확인한 뒤 ${eq}를 이용해 등록 작업을 진행했습니다. 등록 후에는 도어 잠금과 열림, 스마트키 인식, 시동 등 주요 기능을 하나씩 확인했습니다.\n\n작업 결과 ${rs}.${m?`\n\n추가 확인 내용: ${m}`:''}\n\n스마트키를 하나만 보유하고 있다가 분실하면 차량을 바로 사용하기 어렵고 시간과 비용이 더 들어갈 수 있습니다. 사용 가능한 키가 있을 때 예비키를 미리 추가해 두면 훨씬 편합니다.\n\n이번 ${r} ${car} ${w} 작업도 모든 기능을 확인한 뒤 마무리했습니다. 차종과 연식을 알려주시면 작업 가능 여부를 확인하기 편합니다.`;$('#tags').value=tags(car,r);$('#status').textContent='원고를 만들었습니다.'}
$('#generate').onclick=build;$('#pick').onclick=()=>$('#files').click();$('#files').onchange=e=>{[...e.target.files].forEach(f=>{const rd=new FileReader();rd.onload=()=>{srcPhotos.push(rd.result);marked=[];renderPhotos()};rd.readAsDataURL(f)});e.target.value=''};$('#clearPhotos').onclick=()=>{srcPhotos=[];marked=[];renderPhotos()};
function renderPhotos(){const a=marked.length?marked:srcPhotos;$('#photos').innerHTML=a.length?a.map((s,i)=>`<div class="pc"><img src="${s}"><div>${i+1}번${marked.length?' · 번호 적용':''}</div></div>`).join(''):'<div class="note">사진을 선택하세요.</div>'}renderPhotos();
function loadImg(s){return new Promise((ok,no)=>{let i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=s})}async function mark(s){let i=await loadImg(s),c=document.createElement('canvas');c.width=i.naturalWidth;c.height=i.naturalHeight;let x=c.getContext('2d');x.drawImage(i,0,0,c.width,c.height);let z=Math.max(24,Math.round(Math.min(c.width,c.height)*Number($('#size').value))),p=Math.max(18,Math.round(z*.45));x.font=`900 ${z}px sans-serif`;x.textAlign='right';x.textBaseline='bottom';x.lineWidth=Math.max(4,Math.round(z*.12));x.strokeStyle='rgba(0,0,0,.82)';x.strokeText($('#phone').value,c.width-p,c.height-p);x.fillStyle='#ffd400';x.fillText($('#phone').value,c.width-p,c.height-p);return c.toDataURL('image/jpeg',.92)}
$('#watermark').onclick=async()=>{if(!srcPhotos.length)return alert('사진을 먼저 선택하세요.');marked=[];for(let s of srcPhotos)marked.push(await mark(s));renderPhotos();$('#status').textContent='사진에 전화번호를 넣었습니다.'};$('#download').onclick=()=>{if(!marked.length)return alert('먼저 전화번호 넣기를 실행하세요.');marked.forEach((s,i)=>setTimeout(()=>{let a=document.createElement('a');a.href=s;a.download=`드림블로그_${String(i+1).padStart(2,'0')}.jpg`;a.click()},i*250))};
async function cp(t){try{await navigator.clipboard.writeText(t);alert('복사했습니다.')}catch{alert('복사하지 못했습니다.')}}document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{let k=b.dataset.copy,t=k==='all'?`${$('#title').value}\n\n${$('#body').value}\n\n${$('#tags').value}`:$('#'+k).value;cp(t)});$('#naver').onclick=()=>open('https://blog.naver.com','_blank');
function getPosts(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}}function renderHistory(){let a=getPosts();$('#history').innerHTML=a.length?a.slice(0,10).map((p,i)=>`<button class="hist" onclick="loadPost(${i})"><b>${p.car||'차량'}</b><br><small>${p.date} · ${p.work||''}</small></button>`).join(''):'<span class="note">아직 저장한 글이 없습니다.</span>'}window.loadPost=i=>{let p=getPosts()[i];['car','year','region','work','reason','equipment','result','memo','title','body','tags'].forEach(k=>$('#'+k).value=p[k]||'');$('#status').textContent='저장한 작업을 불러왔습니다.'};$('#save').onclick=()=>{let p={date:new Date().toLocaleDateString('ko-KR')};['car','year','region','work','reason','equipment','result','memo','title','body','tags'].forEach(k=>p[k]=$('#'+k).value);let a=getPosts();a.unshift(p);localStorage.setItem(key,JSON.stringify(a.slice(0,50)));renderHistory();$('#status').textContent='작업을 저장했습니다.'};$('#newBtn').onclick=()=>{['car','year','work','reason','result','memo','title','body','tags'].forEach(k=>$('#'+k).value='');$('#region').value='인천 송도';$('#equipment').value='전용 장비';srcPhotos=[];marked=[];renderPhotos()};renderHistory();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
